<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  background: transparent;
  width: 220px; height: 60px;
  overflow: hidden;
  font-family: "Segoe UI", system-ui, sans-serif;
  -webkit-user-select: none;
}
.pill {
  position: absolute;
  inset: 2px;
  background: rgba(17, 19, 23, 0.94);
  border: 1px solid rgba(255,255,255,0.13);
  border-radius: 30px;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 0 8px 0 7px;
  -webkit-app-region: drag;
  cursor: default;
}
.icon-wrap {
  width: 34px; height: 34px;
  flex-shrink: 0;
  -webkit-app-region: no-drag;
  cursor: pointer;
}
.icon-wrap img {
  width: 34px; height: 34px;
  border-radius: 8px;
  object-fit: contain;
  display: block;
}
.info {
  flex: 1;
  min-width: 0;
  -webkit-app-region: drag;
}
.speed {
  color: #4f9ef8;
  font-size: 13px;
  font-weight: 600;
  line-height: 1.35;
}
.sub {
  color: rgba(255,255,255,0.38);
  font-size: 10px;
  line-height: 1.3;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.btns {
  display: flex;
  align-items: center;
  gap: 5px;
  flex-shrink: 0;
  -webkit-app-region: no-drag;
}

/* ── Progress ring button ── */
.ring-btn {
  position: relative;
  width: 34px; height: 34px;
  flex-shrink: 0;
  cursor: pointer;
  -webkit-app-region: no-drag;
  display: flex; align-items: center; justify-content: center;
}
.ring-btn svg {
  position: absolute;
  inset: 0;
  transform: rotate(-90deg); /* start ring at top */
  pointer-events: none;
}
.ring-track {
  fill: none;
  stroke: rgba(255,255,255,0.08);
  stroke-width: 2.5;
}
.ring-fill {
  fill: none;
  stroke: #4f9ef8;
  stroke-width: 2.5;
  stroke-linecap: round;
  /* circumference of r=15: 2π×15 ≈ 94.25 */
  stroke-dasharray: 94.25;
  stroke-dashoffset: 94.25; /* 0% by default */
  transition: stroke-dashoffset 600ms ease, stroke 300ms;
}
.ring-icon {
  position: relative;
  z-index: 1;
  font-size: 12px;
  color: rgba(255,255,255,0.75);
  line-height: 1;
  transition: color 200ms;
  pointer-events: none;
}
.ring-btn:hover .ring-icon { color: #fff; }
.ring-btn:hover .ring-track { stroke: rgba(255,255,255,0.14); }

/* Open-app button */
.open-btn {
  width: 24px; height: 24px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.12);
  background: rgba(255,255,255,0.04);
  color: rgba(255,255,255,0.5);
  font-size: 11px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 100ms, color 100ms;
  outline: none; padding: 0;
  -webkit-app-region: no-drag;
}
.open-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }
</style>
</head>
<body>
<div class="pill">
  <div class="icon-wrap" onclick="openApp()" title="Open Lumi DM">
    <img id="icon" src="http://127.0.0.1:7000/static/favicon-96.png"
         onerror="this.style.display='none'" alt="">
  </div>
  <div class="info">
    <div class="speed" id="speed">Connecting…</div>
    <div class="sub"   id="sub">Lumi DM</div>
  </div>
  <div class="btns">
    <!-- Progress ring wrapping pause/play/check -->
    <div class="ring-btn" id="ring-btn" onclick="ringClick()" title="Pause / Resume all">
      <svg viewBox="0 0 34 34" width="34" height="34">
        <circle class="ring-track" cx="17" cy="17" r="15"/>
        <circle class="ring-fill"  cx="17" cy="17" r="15" id="ring-fill"/>
      </svg>
      <span class="ring-icon" id="ring-icon">⏸</span>
    </div>
    <button class="open-btn" onclick="openApp()" title="Open app">⤢</button>
  </div>
</div>
<script>
const API        = 'http://127.0.0.1:7000';
const CIRC       = 94.25; // 2π × r=15
let _isPaused    = false;
let _active      = 0;
let _allDone     = false;

function openApp() { window.electronWidget?.showMain(); }

async function ringClick() {
  if (_allDone)            { openApp(); return; }
  if (_active === 0 && !_isPaused) { openApp(); return; }
  const ep = _isPaused ? '/api/downloads/resume-all' : '/api/downloads/pause-all';
  await fetch(API + ep, { method: 'POST' }).catch(() => {});
  poll();
}

function fmt(b) {
  if (b >= 1048576) return (b / 1048576).toFixed(2) + ' MB/s';
  if (b >= 1024)    return (b / 1024).toFixed(1)    + ' KB/s';
  return Math.round(b) + ' B/s';
}

function fmtMbps(bps) {
  const mbps = (bps * 8) / 1_000_000;
  if (mbps >= 1) return mbps.toFixed(1) + ' Mbps';
  return ((bps * 8) / 1000).toFixed(0) + ' Kbps';
}

function fmtEta(secs) {
  if (!secs || !isFinite(secs) || secs <= 0) return '';
  const h = Math.floor(secs / 3600);
  const m = Math.floor((secs % 3600) / 60);
  const s = Math.floor(secs % 60);
  if (h > 0)  return `${h}h ${m}m left`;
  if (m > 0)  return `${m}m ${s}s left`;
  if (s > 5)  return `${s}s left`;
  return '< 5s left';
}

function setRing(pct, color, icon) {
  const fill    = document.getElementById('ring-fill');
  const iconEl  = document.getElementById('ring-icon');
  const offset  = CIRC * (1 - Math.max(0, Math.min(1, pct)));
  fill.style.strokeDashoffset = offset;
  fill.style.stroke           = color;
  iconEl.textContent          = icon;
  iconEl.style.color          = color === '#5ed19d' ? '#5ed19d'
                              : color === '#fbbf24' ? '#fbbf24'
                              : 'rgba(255,255,255,0.75)';
}

let _lastCapBps = 0;

async function poll() {
  try {
    const [dlData, netData] = await Promise.all([
      fetch(API + '/api/downloads?limit=100').then(r => r.json()),
      fetch(API + '/api/netstats').then(r => r.json()).catch(() => ({})),
    ]);
    const downloads = dlData.downloads || [];
    const active  = downloads.filter(j => j.status === 'running');
    const paused  = downloads.filter(j => j.status === 'paused');
    const done    = downloads.filter(j => j.status === 'completed');
    const speed   = active.reduce((s, j) => s + (+j.speed_bytes_per_sec || 0), 0);

    // Update cached capacity whenever probe returns a meaningful value
    const cap = +(netData.capacity_bps || 0);
    if (cap > 125000) _lastCapBps = cap;  // > 1 Mbps = real result

    _active   = active.length;
    _isPaused = _active === 0 && paused.length > 0;
    _allDone  = downloads.length > 0 && _active === 0 && paused.length === 0 && done.length > 0;

    // Aggregate progress across all running downloads
    const totalSz = active.reduce((s, j) => s + (+j.total_bytes        || 0), 0);
    const dlSz    = active.reduce((s, j) => s + (+j.downloaded_bytes   || 0), 0);
    const pct     = totalSz > 0 ? dlSz / totalSz : 0;

    const speedEl = document.getElementById('speed');
    const subEl   = document.getElementById('sub');

    // ETA from total remaining bytes / total speed
    const totalRemaining = active.reduce((s, j) => s + Math.max(0, (+j.total_bytes || 0) - (+j.downloaded_bytes || 0)), 0);
    const etaSecs  = speed > 0 && totalRemaining > 0 ? totalRemaining / speed : 0;
    const etaStr   = fmtEta(etaSecs);

    const capStr = _lastCapBps > 0 ? '↓ ' + fmtMbps(_lastCapBps) : '';

    if (_active > 0) {
      speedEl.textContent = '⬇ ' + fmt(speed);
      const etaPart = etaStr ? etaStr : (_active > 1 ? `${_active} files` : '');
      subEl.textContent = [capStr, etaPart].filter(Boolean).join(' · ');
    } else if (_allDone) {
      speedEl.textContent = '✓ Complete';
      const doneStr = `${done.length} file${done.length !== 1 ? 's' : ''} done`;
      subEl.textContent = [capStr, doneStr].filter(Boolean).join(' · ');
    } else if (_isPaused) {
      speedEl.textContent = '⏸ Paused';
      const pausedStr = `${paused.length} paused`;
      subEl.textContent = [capStr, pausedStr].filter(Boolean).join(' · ');
    } else if (_lastCapBps > 0) {
      speedEl.textContent = capStr;
      subEl.textContent   = 'No downloads';
    } else {
      speedEl.textContent = '—';
      subEl.textContent   = 'No downloads';
    }

    if (_allDone) {
      // All finished — full green ring + checkmark
      setRing(1, '#5ed19d', '✓');
      document.getElementById('ring-btn').title = 'All done — open app';
    } else if (_active > 0) {
      // Downloading — blue partial ring + pause icon
      setRing(pct, '#4f9ef8', '⏸');
      document.getElementById('ring-btn').title = 'Pause all';
    } else if (_isPaused) {
      // Paused — yellow partial ring (keep last progress) + play icon
      const pausedSz = paused.reduce((s, j) => s + (+j.total_bytes      || 0), 0);
      const pausedDl = paused.reduce((s, j) => s + (+j.downloaded_bytes || 0), 0);
      const pausedPct = pausedSz > 0 ? pausedDl / pausedSz : 0;
      setRing(pausedPct, '#fbbf24', '▶');
      document.getElementById('ring-btn').title = 'Resume all';
    } else {
      // Idle — empty dim ring + pause icon
      setRing(0, 'rgba(255,255,255,0.18)', '⏸');
      document.getElementById('ring-btn').title = 'No active downloads';
    }
  } catch {
    document.getElementById('speed').textContent = 'Offline';
    document.getElementById('sub').textContent   = 'Server not reachable';
    setRing(0, 'rgba(255,255,255,0.1)', '⏸');
  }
}

poll();
setInterval(poll, 2000);
</script>
</body>
</html>
