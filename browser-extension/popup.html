<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lumi DM</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #111317; --surface: #1a1d22; --border: rgba(255,255,255,0.08);
  --text: #e8eaed; --muted: #8a8f9a; --accent: #4f9ef8; --green: #5ed19d;
  --red: #f87171; --yellow: #fbbf24; --font: "Inter", system-ui, sans-serif;
}
html, body { background: var(--bg); color: var(--text); font-family: var(--font);
  font-size: 13px; width: 360px; min-height: 200px; }
.header { display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px 10px; border-bottom: 1px solid var(--border); }
.brand { font-weight: 700; font-size: 14px; display:flex; align-items:center; gap:8px }
.popup-logo { width:18px; height:18px; border-radius:4px; object-fit:contain; }
.open-btn { font-size: 11px; color: var(--accent); background: none; border: none;
  cursor: pointer; padding: 2px 0; }
.open-btn:hover { text-decoration: underline; }

.url-row { padding: 10px 14px; display: flex; gap: 6px; }
.url-input { flex: 1; background: rgba(255,255,255,0.05);
  border: 1px solid var(--border); border-radius: 6px; color: var(--text);
  font-size: 12px; padding: 5px 9px; }
.url-input:focus { outline: none; border-color: rgba(79,158,248,0.4); }
.go-btn { background: var(--accent); color: #fff; border: none; border-radius: 6px;
  padding: 5px 12px; font-size: 12px; font-weight: 600; cursor: pointer;
  white-space: nowrap; }
.go-btn:hover { opacity: 0.85; }

.type-row { display: flex; gap: 4px; padding: 0 14px 10px; }
.type-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border);
  color: var(--muted); border-radius: 6px; padding: 3px 10px;
  font-size: 11px; cursor: pointer; transition: background 100ms, color 100ms; }
.type-btn.is-active { background: rgba(79,158,248,0.15); color: var(--accent);
  border-color: rgba(79,158,248,0.3); }
.type-btn:hover { background: rgba(255,255,255,0.08); color: var(--text); }

.status-msg { padding: 0 14px 8px; font-size: 11px; color: var(--muted); min-height: 16px; }

.dl-section { border-top: 1px solid var(--border); }
.dl-header { display: flex; align-items: center; justify-content: space-between;
  padding: 8px 14px 6px; }
.dl-title { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; }
.clear-link { font-size: 10px; color: var(--muted); background: none; border: none;
  cursor: pointer; padding: 0; }
.clear-link:hover { color: var(--text); }

.dl-list { max-height: 260px; overflow-y: auto; padding: 0 10px 8px; }
.dl-item { display: flex; align-items: center; gap: 6px; padding: 6px 4px;
  border-bottom: 1px solid var(--border); }
.dl-item:last-child { border-bottom: none; }
.dl-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.dl-dot.running   { background: var(--accent); }
.dl-dot.completed { background: var(--green); }
.dl-dot.failed,
.dl-dot.cancelled { background: var(--red); }
.dl-dot.paused    { background: var(--yellow); }
.dl-dot.queued    { background: rgba(255,255,255,0.2); }
.dl-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
.dl-pct  { font-size: 10px; color: var(--muted); flex-shrink: 0; }

.empty-msg { padding: 12px 4px; font-size: 12px; color: var(--muted); text-align: center; }

.settings-row { display: flex; align-items: center; gap: 6px;
  padding: 8px 14px; border-top: 1px solid var(--border); }
.settings-row label { font-size: 11px; color: var(--muted); white-space: nowrap; }
.server-input { flex: 1; background: rgba(255,255,255,0.04);
  border: 1px solid var(--border); border-radius: 5px; color: var(--text);
  font-size: 11px; padding: 4px 8px; }
.server-input:focus { outline: none; border-color: rgba(79,158,248,0.3); }
.save-btn { background: rgba(255,255,255,0.06); border: 1px solid var(--border);
  color: var(--muted); border-radius: 5px; padding: 4px 8px; font-size: 11px;
  cursor: pointer; transition: background 100ms; }
.save-btn:hover { background: rgba(255,255,255,0.12); color: var(--text); }

.tabs-row { display: flex; align-items: center; gap: 8px;
  padding: 8px 14px; border-top: 1px solid var(--border); }
.tabs-btn { flex-shrink: 0; background: rgba(79,158,248,0.1); border: 1px solid rgba(79,158,248,0.25);
  color: var(--accent); border-radius: 6px; padding: 5px 10px; font-size: 11px;
  font-weight: 600; cursor: pointer; white-space: nowrap; transition: background 100ms; }
.tabs-btn:hover { background: rgba(79,158,248,0.2); }
.tabs-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.tabs-info { font-size: 10px; color: var(--muted); flex: 1; }
.intercept-row { display: flex; align-items: center; justify-content: space-between;
  padding: 8px 14px; border-top: 1px solid var(--border); }
.intercept-row label { font-size: 12px; color: var(--text); cursor: pointer; }
.intercept-row .hint { font-size: 10px; color: var(--muted); }
.toggle { position: relative; width: 34px; height: 18px; flex-shrink: 0; }
.toggle input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; inset: 0; background: rgba(255,255,255,0.1);
  border-radius: 18px; transition: background 150ms; cursor: pointer; }
.slider:before { content: ""; position: absolute; width: 12px; height: 12px;
  left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: transform 150ms; }
.toggle input:checked + .slider { background: var(--accent); }
.toggle input:checked + .slider:before { transform: translateX(16px); }

/* Live speed bar */
.speed-bar {
  display: flex; align-items: center; gap: 7px;
  padding: 7px 14px; border-top: 1px solid var(--border);
  font-size: 12px; font-weight: 600; color: var(--accent);
}
.speed-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: rgba(255,255,255,0.15); flex-shrink: 0;
  transition: background 300ms;
}
.speed-dot.active { background: var(--green); }
.speed-sep { color: var(--muted); font-weight: 400; }
.speed-sub { font-size: 10px; color: var(--muted); font-weight: 400; flex: 1; text-align: right; }

/* Advanced toggle */
.adv-toggle {
  font-size: 10px; color: var(--muted); padding: 6px 14px;
  cursor: pointer; border-top: 1px solid var(--border);
  transition: color 100ms; user-select: none;
}
.adv-toggle:hover { color: var(--text); }

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 4px; }
</style>
</head>
<body>

<div class="header">
  <div class="brand"><img src="icons/icon48.png" class="popup-logo" alt="logo">⬇ Lumi DM</div>
  <button class="open-btn" id="open-ui">Open full UI →</button>
</div>

<div class="url-row">
  <input class="url-input" id="url-input" type="text"
    placeholder="Paste URL, magnet link, or video URL…">
  <button class="go-btn" id="go-btn">Go</button>
</div>

<div class="type-row">
  <button class="type-btn is-active" data-type="auto">Auto</button>
  <button class="type-btn" data-type="video">Video</button>
  <button class="type-btn" data-type="torrent">Torrent</button>
</div>

<div class="status-msg" id="status-msg"></div>

<div class="dl-section">
  <div class="dl-header">
    <span class="dl-title">Recent downloads</span>
    <button class="clear-link" id="clear-btn">Clear done</button>
  </div>
  <div class="dl-list" id="dl-list">
    <div class="empty-msg" id="empty-msg">Connecting to server…</div>
  </div>
</div>

<div class="tabs-row">
  <button class="tabs-btn" id="all-tabs-btn">⚡ From all open tabs</button>
  <div id="tabs-status" class="tabs-info"></div>
</div>
<div class="intercept-row">
  <div>
    <div style="font-size:12px;color:var(--text);font-weight:600">Intercept all downloads</div>
    <div class="hint">Redirect browser downloads to Lumi DM</div>
  </div>
  <label class="toggle">
    <input type="checkbox" id="intercept-toggle" checked>
    <span class="slider"></span>
  </label>
</div>
<!-- Live speed bar -->
<div class="speed-bar" id="speed-bar">
  <span class="speed-dot" id="speed-dot"></span>
  <span id="inet-label" title="Live internet speed">↓ 0 Mbps</span>
  <span class="speed-sep">·</span>
  <span id="speed-label" title="App download speed">⬇ 0 B/s</span>
  <span class="speed-sub" id="speed-sub">No active downloads</span>
</div>

<!-- Server (collapsed by default) -->
<div class="adv-toggle" onclick="toggleAdv()">⚙ Server settings <span id="adv-arrow">▸</span></div>
<div class="settings-row" id="server-row" style="display:none">
  <input class="server-input" id="server-input" type="text" placeholder="http://localhost:7000">
  <button class="save-btn" id="save-server">Save</button>
</div>

<script src="popup.js"></script>
</body>
</html>
