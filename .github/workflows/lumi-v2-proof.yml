name: Lumi V2 Proof

on:
  pull_request:
  push:
    branches:
      - lumi-v2-10-for-2

permissions:
  contents: read
  pull-requests: write

jobs:
  runtime-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install proof dependencies quietly
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt pytest

      - name: Compile source
        run: python -m compileall -q core server.py tests

      - name: Run Lumi runtime proofs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          pytest -q > /tmp/lumi-pytest.log 2>&1
          status=$?
          cat /tmp/lumi-pytest.log
          if [ "$status" -ne 0 ] && [ -n "$PR_NUMBER" ]; then
            {
              echo "### Lumi runtime proof failure"
              echo
              echo '```text'
              tail -n 180 /tmp/lumi-pytest.log
              echo '```'
            } > /tmp/lumi-proof-comment.md
            gh pr comment "$PR_NUMBER" --body-file /tmp/lumi-proof-comment.md
          fi
          exit $status

  sergeant-review:
    needs: runtime-proof
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Sergeant quietly
        run: python -m pip install --disable-pip-version-check -q sergeant-reviewer==0.4.0

      - name: Sergeant primary review
        shell: bash
        env:
          SERGEANT_CPL_POLICY: disabled
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          sergeant pr-review . --pretty > /tmp/lumi-sergeant.log 2>&1
          status=$?
          cat /tmp/lumi-sergeant.log
          if [ "$status" -ne 0 ] && [ -n "$PR_NUMBER" ]; then
            {
              echo "### Sergeant primary review finding"
              echo
              echo '```text'
              tail -n 220 /tmp/lumi-sergeant.log
              echo '```'
            } > /tmp/lumi-sergeant-comment.md
            gh pr comment "$PR_NUMBER" --body-file /tmp/lumi-sergeant-comment.md
          fi
          exit $status
