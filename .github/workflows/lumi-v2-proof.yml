name: Lumi V2 Proof

on:
  pull_request:
  push:
    branches:
      - lumi-v2-10-for-2

permissions:
  contents: read

jobs:
  runtime-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install proof dependencies quietly
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt pytest

      - name: Compile source
        run: python -m compileall -q core server.py tests

      - name: Run Lumi runtime proofs
        shell: bash
        run: |
          set +e
          pytest -q > /tmp/lumi-pytest.log 2>&1
          status=$?
          cat /tmp/lumi-pytest.log
          exit $status

  sergeant-review:
    needs: runtime-proof
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Sergeant quietly
        run: python -m pip install --disable-pip-version-check -q sergeant-reviewer==0.4.0

      - name: Sergeant primary review
        env:
          SERGEANT_CPL_POLICY: disabled
        run: sergeant pr-review . --pretty
