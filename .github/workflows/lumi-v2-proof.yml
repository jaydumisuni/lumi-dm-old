name: Lumi V2 Proof

on:
  pull_request:
  push:
    branches:
      - lumi-v2-10-for-2

permissions:
  contents: read

jobs:
  runtime-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime and proof dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Compile source
        run: python -m compileall -q core server.py tests

      - name: Run Lumi runtime proofs
        run: pytest -q

      - name: Install Sergeant reviewer
        run: python -m pip install sergeant-reviewer==0.4.0

      - name: Sergeant primary review
        env:
          SERGEANT_CPL_POLICY: disabled
        run: sergeant pr-review . --pretty
